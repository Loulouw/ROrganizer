[package]
name = "rorganizer"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Loulouw"]
description = "Window manager for multiple Dofus Unity accounts"
repository = "https://github.com/Loulouw/ROrganizer"
homepage = "https://github.com/Loulouw/ROrganizer"
readme = "README.md"
keywords = ["dofus", "multibox", "window-manager", "tray", "windows"]
categories = ["gui"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
egui_extras = { version = "0.29", default-features = false, features = ["svg"] }
egui_dnd = "0.10"
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
raw-window-handle = "0.6"
regex = "1"
rust-i18n = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
webbrowser = "1"
arc-swap = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_UI_Accessibility",
] }

[build-dependencies]
embed-resource = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
