[package]
name = "rorganizer"
version = "1.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Loulouw"]
description = "Window manager for multiple Dofus Unity and Retro accounts"
repository = "https://github.com/Loulouw/ROrganizer"
homepage = "https://rorganizer.loulouw-labs.fr"
readme = "README.md"
keywords = ["dofus", "multibox", "window-manager", "windows", "macos"]
categories = ["gui"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
# Les glyphes refresh (U+27F3), warning (U+26A0) et dossier (U+1F4C1) de l'UI
# n'existent que dans les polices emoji embarquées, que default_fonts n'inclut
# pas : sans cette feature, tofu à l'écran.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
egui_dnd = "0.18"
# default = ["gtk", "libxdo"] : uniquement le backend tray Linux/BSD, jamais
# compilé ici (deps target-gated). Les garder ne ferait qu'entretenir la
# famille gtk-rs non maintenue dans le lockfile et dans chaque rapport d'audit.
tray-icon = { version = "0.26", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
raw-window-handle = "0.6"
regex = "1"
rust-i18n = "4"
image = { version = "0.25", default-features = false, features = ["png"] }
webbrowser = "1"
arc-swap = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

# Already in the graph through eframe, tray-icon and glutin: same versions,
# features trimmed to what platform/macos calls.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSBezierPath",
    "NSCell",
    "NSColor",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStringDrawing",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSLocale",
    "NSNotification",
    "NSOperation",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFArray",
    "CFData",
    "CFDate",
    "CFMachPort",
    "CFMessagePort",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventTypes",
] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
block2 = "0.6"

[build-dependencies]
embed-resource = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
