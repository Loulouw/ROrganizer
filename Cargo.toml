[package]
name = "rorganizer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Louis Zwawiak"]
description = "Window manager for multiple Dofus Unity accounts"
repository = ""
readme = "README.md"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
egui_extras = { version = "0.29", default-features = false, features = ["svg"] }
egui_dnd = "0.10"
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
raw-window-handle = "0.6"
regex = "1"
rust-i18n = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Globalization",
] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
