[package]
name = "rorganizer"
version = "1.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Loulouw"]
description = "Window manager for multiple Dofus Unity and Retro accounts"
repository = "https://github.com/Loulouw/ROrganizer"
homepage = "https://rorganizer.loulouw-labs.fr"
readme = "README.md"
keywords = ["dofus", "multibox", "window-manager", "tray", "windows"]
categories = ["gui"]

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.35"
egui_extras = { version = "0.35", default-features = false, features = ["svg"] }
egui_dnd = "0.16"
# default = ["gtk", "libxdo"] : uniquement le backend tray Linux/BSD, jamais
# compilé ici (deps target-gated). Les garder ne ferait qu'entretenir la
# famille gtk-rs non maintenue dans le lockfile et dans chaque rapport d'audit.
tray-icon = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
raw-window-handle = "0.6"
regex = "1"
rust-i18n = "4"
image = { version = "0.25", default-features = false, features = ["png"] }
webbrowser = "1"
arc-swap = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_UI_Accessibility",
] }

[build-dependencies]
embed-resource = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
