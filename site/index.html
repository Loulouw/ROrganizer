<!DOCTYPE html>
<html lang="en" data-gate>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROrganizer</title>

<!-- Cette page ne porte aucun contenu : elle envoie le visiteur vers la
     version correspondant à sa langue. Elle est donc exclue de l'index — mais
     par `noindex` et non par robots.txt, sinon les robots ne liraient jamais
     l'interdiction. Le crawl reste autorisé, et les trois versions sont
     atteintes par le sitemap et les annotations hreflang. -->
<meta name="robots" content="noindex, follow">

<link rel="alternate" hreflang="fr" href="https://rorganizer.loulouw-labs.fr/fr/">
<link rel="alternate" hreflang="en" href="https://rorganizer.loulouw-labs.fr/en/">
<link rel="alternate" hreflang="es" href="https://rorganizer.loulouw-labs.fr/es/">
<link rel="alternate" hreflang="x-default" href="https://rorganizer.loulouw-labs.fr/en/">

<!-- Carte de partage : les robots de Discord, X ou Facebook n'exécutent pas
     le JS, ils restent ici et lisent ces balises. Une seule langue possible
     par URL : le français, langue de la majorité du public. Reprend les
     valeurs de /fr/. Sans effet sur l'indexation, le noindex reste. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ROrganizer">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://rorganizer.loulouw-labs.fr/">
<meta property="og:title" content="ROrganizer — Organizer multicompte gratuit, Dofus 3 et Rétro, Windows et Mac">
<meta property="og:description" content="Bascule entre tes comptes Dofus d'un seul appui clavier ou souris. Gratuit, open source, hors-ligne.">
<meta property="og:image" content="https://rorganizer.loulouw-labs.fr/assets/img/og-fr.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="ROrganizer — organizer multicompte pour Dofus Unity et Dofus Rétro">
<meta name="twitter:card" content="summary_large_image">

<meta name="theme-color" content="#f4f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161714" media="(prefers-color-scheme: dark)">

<!-- Nom du site pour Google, lu sur la page d'accueil. Le noindex n'y fait
     pas obstacle : Google suit la redirection vers /en/, qui porte le même
     bloc. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "ROrganizer",
  "url": "https://rorganizer.loulouw-labs.fr/"
}
</script>

<link rel="icon" href="assets/img/icon.png" type="image/png">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/app.js"></script>
</head>
<body>

<!-- Repli sans JavaScript : trois liens en clair. Un visiteur qui n'exécute
     pas de script choisit lui-même, un robot suit les liens. -->
<main class="gate">
  <img src="assets/img/icon.png" width="56" height="56" alt="ROrganizer">
  <div>
    <h1 style="font-size:var(--fs-lg)">ROrganizer</h1>
    <p style="margin-top:0.6rem;color:var(--ink-soft)">Choose your language · Choisis ta langue · Elige tu idioma</p>
  </div>
  <div class="gate__choice">
    <a class="btn btn--ghost" href="fr/" hreflang="fr"><img class="flag" src="assets/img/flags/fr.svg" width="21" height="15" alt="">Français</a>
    <a class="btn btn--ghost" href="en/" hreflang="en"><img class="flag" src="assets/img/flags/en.svg" width="21" height="15" alt="">English</a>
    <a class="btn btn--ghost" href="es/" hreflang="es"><img class="flag" src="assets/img/flags/es.svg" width="21" height="15" alt="">Español</a>
  </div>
</main>

</body>
</html>
